[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector-ia"
version = "1.0.0"
description = "CRM local para prospecção comercial com revisão humana"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit==1.50.0",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
